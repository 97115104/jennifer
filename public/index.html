<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jennifer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234f8ef7'/><text y='67' x='50' text-anchor='middle' font-size='50' fill='white'>J</text></svg>">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-state="idle">

  <div class="container">
    <header>
      <div class="orb" id="orb">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2"/>
          <text x="50" y="62" text-anchor="middle" font-size="36" fill="currentColor">J</text>
        </svg>
      </div>
      <h1>Jennifer</h1>
      <div class="header-actions">
        <a href="/settings" class="settings-link" title="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 0 1 7.4 2.34l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
        <a href="/memory" class="memory-link" title="Memory variables">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>
          </svg>
        </a>
      </div>
    </header>

    <div class="status-bar">
      <span id="status">Initializing...</span>
      <div class="dot" id="dot"></div>
    </div>

    <div id="tts-progress" class="tts-progress hidden" aria-live="polite">
      <div class="tts-progress-meta">
        <span id="tts-progress-label">Generating cloned speech...</span>
        <span id="tts-progress-percent">0%</span>
      </div>
      <div class="tts-progress-track">
        <div id="tts-progress-fill" class="tts-progress-fill"></div>
      </div>
    </div>

    <canvas id="waveform" width="600" height="80"></canvas>

    <div id="transcript-container">
      <div id="transcript"></div>
    </div>

    <div class="actions">
      <button id="start-btn" class="btn primary">Start Listening</button>
      <div id="controls" class="hidden">
        <button id="manual-btn" class="btn secondary" title="Manually trigger listening">
          &#9679; Record
        </button>
        <button id="reset-btn" class="btn ghost">Reset Chat</button>
      </div>
    </div>

    <p class="hint" id="hint">Say <em>"Ok Jennifer"</em> to start, or click Record</p>
  </div>

  <!-- Silero VAD ML model (served locally from node_modules) -->
  <script src="/vad/ort.js"></script>
  <script>
    if (window.ort?.env?.wasm) window.ort.env.wasm.wasmPaths = '/vad/';
  </script>
  <script src="/vad/bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
