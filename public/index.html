<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jennifer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234f8ef7'/><text y='67' x='50' text-anchor='middle' font-size='50' fill='white'>J</text></svg>">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-state="idle">

  <div class="container">
    <header>
      <div class="orb" id="orb">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2"/>
          <text x="50" y="62" text-anchor="middle" font-size="36" fill="currentColor">J</text>
        </svg>
      </div>
      <h1>Jennifer</h1>
    </header>

    <div class="status-bar">
      <span id="status">Initializing...</span>
      <div class="dot" id="dot"></div>
    </div>

    <canvas id="waveform" width="600" height="80"></canvas>

    <div id="transcript-container">
      <div id="transcript"></div>
    </div>

    <div class="actions">
      <button id="start-btn" class="btn primary">Start Listening</button>
      <div id="controls" class="hidden">
        <button id="manual-btn" class="btn secondary" title="Manually trigger recording">
          &#9679; Record
        </button>
        <button id="reset-btn" class="btn ghost">Reset Chat</button>
      </div>
    </div>

    <p class="hint" id="hint">Say <em>"Ok Jennifer"</em> to start, or click Record</p>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
